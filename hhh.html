<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meet the Founder &amp; CEO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        /* Theme tokens taken from style.css */
        :root {
            --white: #ffffff;
            --ink: #111111;
            --muted: #666666;
            --line: #d8d8d8;
            --font: "Archivo", Arial, Helvetica, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            overflow-x: clip;
            background: var(--white);
            font-family: var(--font);
            color: var(--ink)
        }

        img {
            display: block;
            width: 100%;
            font-size: 0;
            color: transparent
        }

        .meet {
            width: 100%;
            background: var(--white);
            display: grid;
            grid-template-columns: 13.5fr 18.7fr 15.5fr 1.5fr 19.5fr 2fr 22.5fr;
            padding: 4vw 2.6vw 2.2vw 4.2vw;
        }

        /* left copy */
        .copy {
            grid-column: 1;
            grid-row: 1;
            align-self: start
        }

        .eyebrow {
            display: block;
            font-size: clamp(10px, .85vw, 11px);
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
        }

        .name {
            margin-top: 1.1vw;
            font-size: clamp(28px, 3.6vw, 54px);
            font-weight: 500;
            line-height: 1.05;
            color: var(--ink)
        }

        .text {
            margin-top: 1.4vw;
            font-size: clamp(11px, .9vw, 12px);
            line-height: 1.6;
            color: var(--muted)
        }

        .rule {
            margin-top: 1.8vw;
            border: 0;
            border-top: 1px solid var(--line)
        }

        /* images */
        .img-a {
            grid-column: 3;
            grid-row: 1;
            align-self: end
        }

        .img-b {
            grid-column: 5;
            grid-row: 1;
            align-self: start;
            margin-top: 2.4vw
        }

        /* right list */
        .list {
            grid-column: 7;
            grid-row: 1;
            align-self: end
        }

        .toggle {
            display: block;
            text-align: right;
            font-size: clamp(12px, 1.4vw, 14px);
            line-height: 1;
            color: var(--ink);
            margin-bottom: 1.6vw
        }

        .item {
            display: flex;
            align-items: flex-start;
            gap: .9vw;
            padding: .9vw 0;
            border-top: 1px solid var(--line);
            font-size: clamp(11px, .85vw, 12px);
            line-height: 1.5;
            color: var(--muted);
            cursor: pointer;
        }

        .item:last-child {
            border-bottom: 1px solid var(--line)
        }

        .item input {
            width: clamp(11px, 1vw, 13px);
            margin-top: .15vw;
            flex: none;
            accent-color: var(--ink)
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width:900px) {
            .meet {
                grid-template-columns: 1fr 1fr;
                column-gap: 16px;
                row-gap: 32px;
                padding: 40px 5vw
            }

            .copy {
                grid-column: 1/-1;
                grid-row: 1
            }

            .name {
                font-size: clamp(32px, 7vw, 48px);
                margin-top: 12px
            }

            .text {
                font-size: 14px;
                margin-top: 16px
            }

            .rule {
                margin-top: 24px
            }

            .img-a {
                grid-column: 1;
                grid-row: 2;
                align-self: start
            }

            .img-b {
                grid-column: 2;
                grid-row: 2;
                align-self: start;
                margin-top: 0
            }

            .list {
                grid-column: 1/-1;
                grid-row: 3
            }

            .toggle {
                font-size: 18px;
                margin-bottom: 12px
            }

            .item {
                gap: 12px;
                padding: 14px 0;
                font-size: 13px
            }

            .item input {
                width: 16px;
                height: 16px;
                margin-top: 2px
            }
        }

        @media (max-width:425px) {
            .meet {
                grid-template-columns: 1fr;
                padding: 32px 16px;
                row-gap: 24px
            }

            .name {
                font-size: 32px
            }

            .img-a {
                grid-column: 1;
                grid-row: 2
            }

            .img-b {
                grid-column: 1;
                grid-row: 3
            }

            .list {
                grid-row: 4
            }
        }
    </style>
</head>

<body>

    <section class="meet">
        <div class="copy">
            <span class="eyebrow">Meet the Founder &amp; CEO</span>
            <h2 class="name">I'm Name</h2>
            <p class="text">This paragraph text goes here. Lorem ipsum dolor sit amet consectetur adipiscing elit, sed
                do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam.</p>
            <hr class="rule">
        </div>

        <img class="img-a" src="https://placehold.co/440x690/f2f2f2/111111?text=Image+1" alt="Founder portrait one">
        <img class="img-b" src="https://placehold.co/560x620/f2f2f2/111111?text=Image+2" alt="Founder portrait two">

        <div class="list">
            <span class="toggle" aria-hidden="true">&minus;</span>
            <label class="item"><input type="checkbox"><span>Lorem ipsum dolor sit amet consectetur adipiscing elit sed
                    do eiusmod tempor.</span></label>
            <label class="item"><input type="checkbox"><span>Lorem ipsum dolor sit amet consectetur adipiscing elit sed
                    do eiusmod tempor.</span></label>
            <label class="item"><input type="checkbox"><span>Lorem ipsum dolor sit amet consectetur adipiscing elit sed
                    do eiusmod tempor.</span></label>
            <label class="item"><input type="checkbox"><span>Lorem ipsum dolor sit amet consectetur adipiscing elit sed
                    do eiusmod tempor.</span></label>
        </div>
    </section>

</body>

</html>
