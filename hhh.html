<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Why Choose Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        /* Theme tokens taken from style.css */
        :root {
            --bg: #f9f9f9;
            --ink: #111111;
            --muted: #666666;
            --line: #d8d8d8;
            --font: "Archivo", Arial, Helvetica, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            overflow-x: clip;
            background: var(--bg);
            font-family: var(--font);
            color: var(--ink)
        }

        img {
            display: block;
            width: 100%;
            font-size: 0;
            color: transparent
        }

        /* Measured from the Figma (359px wide frame): 1px = .2786vw
     text 22vw | gap 7.8 | image A 15.3 | gap 1.4 | image B 15.6 | gap 5 | list 24.8 */
        .meet {
            width: 100%;
            background: var(--bg);
            display: grid;
            align-items: start;
            grid-template-columns: 21.6fr 7.8fr 15.3fr 1.4fr 15.6fr 5fr 24.8fr;
            padding: 2.1vw 3.5vw 3vw 5vw;
        }

        /* left copy */
        .copy {
            grid-column: 1;
            grid-row: 1
        }

        .eyebrow {
            display: block;
            font-size: clamp(10px, .85vw, 11px);
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
        }

        .name {
            margin-top: .9vw;
            font-size: clamp(20px, 2.2vw, 54px);
            font-weight: 500;
            line-height: 1.05;
            color: var(--ink)
        }

        .text {
            margin-top: 1.3vw;
            font-size: clamp(11px, .85vw, 12px);
            line-height: 1.55;
            color: var(--muted)
        }

        .rule {
            margin-top: 2.2vw;
            border: 0;
            border-top: 1px solid var(--ink)
        }

        /* images: width only, height comes from the image ratio (A 55x82, B 56x75) */
        .img-a {
            grid-column: 3;
            grid-row: 1;
            margin-top: 7.9vw
        }

        .img-b {
            grid-column: 5;
            grid-row: 1;
            margin-top: 3.2vw
        }

        /* right list */
        .list {
            grid-column: 7;
            grid-row: 1;
            margin-top: 13.5vw
        }

        .toggle {
            display: block;
            width: clamp(12px, 2vw, 16px);
            margin: 0 0 1.7vw auto;
            stroke: var(--ink);
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .item {
            display: flex;
            align-items: flex-start;
            gap: .9vw;
            padding: 1.5vw 0;
            border-bottom: 1px solid #eeeeee;
            font-size: clamp(10px, .8vw, 12px);
            line-height: 1.5;
            color: var(--muted);
            cursor: pointer;
        }

        .toggle+.item {
            border-top: 1px solid var(--line)
        }

        .item:last-child {
            border-bottom: 0
        }

        .item input {
            appearance: none;
            -webkit-appearance: none;
            flex: none;
            width: clamp(11px, .9vw, 13px);
            height: clamp(11px, .9vw, 13px);
            margin-top: .2vw;
            border: 1px solid var(--ink);
            background: transparent;
            cursor: pointer;
        }

        .item input:checked {
            background: var(--ink);
            box-shadow: inset 0 0 0 2px var(--bg)
        }

        .item input:focus-visible {
            outline: 2px solid var(--muted);
            outline-offset: 2px
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width:900px) {
            .meet {
                grid-template-columns: 1fr 1fr;
                column-gap: 16px;
                row-gap: 32px;
                padding: 40px 5vw
            }

            .copy {
                grid-column: 1/-1;
                grid-row: 1
            }

            .name {
                font-size: clamp(32px, 7vw, 48px);
                margin-top: 12px
            }

            .text {
                width: 100%;
                font-size: 14px;
                margin-top: 16px
            }

            .rule {
                width: 100%;
                margin-top: 24px
            }

            .img-a {
                grid-column: 1;
                grid-row: 2;
                margin-top: 0
            }

            .img-b {
                grid-column: 2;
                grid-row: 2;
                margin-top: 0
            }

            .list {
                grid-column: 1/-1;
                grid-row: 3;
                margin-top: 0
            }

            .toggle {
                width: 20px;
                margin: 0 0 12px auto
            }

            .item {
                gap: 12px;
                padding: 14px 0;
                font-size: 13px
            }

            .item input {
                width: 16px;
                height: 16px;
                margin-top: 2px
            }
        }

        @media (max-width:425px) {
            .meet {
                grid-template-columns: 1fr;
                padding: 32px 16px;
                row-gap: 24px
            }

            .name {
                font-size: 32px
            }

            .img-a {
                grid-column: 1;
                grid-row: 2
            }

            .img-b {
                grid-column: 1;
                grid-row: 3
            }

            .list {
                grid-row: 4
            }
        }
    </style>
</head>

<body>

    <section class="meet">
        <div class="copy">
            <span class="eyebrow">Why Choose Us</span>
            <h2 class="name">Our Professional Fragrance Craft</h2>
            <p class="text">At Ministry Perfume, we blend rare botanicals, exotic resins, and fine oils to create luxury
                scents that captivate every scene. Each bottle is designed with utmost precision, delivering rich
                olfactory depth and signature elegance for any occasion.</p>
            <hr class="rule">
        </div>

        <img class="img-a" src="https://placehold.co/440x656/f2f2f2/111111?text=Image+1" alt="Founder portrait one">
        <img class="img-b" src="https://placehold.co/448x600/f2f2f2/111111?text=Image+2" alt="Founder portrait two">

        <div class="list">
            <svg class="toggle" viewBox="0 0 16 10" aria-hidden="true">
                <path d="M2 2l6 6 6-6" />
            </svg>
            <label class="item"><input type="checkbox"><span>Artisanal Formulations</span></label>
            <label class="item"><input type="checkbox"><span>Long-Lasting Projection</span></label>
            <label class="item"><input type="checkbox"><span>Certified Perfumers</span></label>
            <label class="item"><input type="checkbox"><span>Unbeatable Pricing</span></label>
        </div>
    </section>

</body>

</html>
